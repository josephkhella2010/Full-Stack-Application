# CI/CD workflow

name: CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: Build and test with Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: |
            backend/package-lock.json
            frontend/project/package-lock.json

      # Backend

      - name: Install backend dependencies
        run: npm ci
        working-directory: ./backend

      - name: Backend TypeScript check
        run: npm run check
        working-directory: ./backend

      - name: Backend lint
        run: npm run lint
        working-directory: ./backend

      # Frontend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: ./frontend/project

      - name: Frontend build
        run: npm run build
        working-directory: ./frontend/project

      - name: Frontend lint
        run: npm run lint
        working-directory: ./frontend/project

      # Final steps

      - name: List files
        run: ls -la

      - name: Success message
        run: echo "CI/CD completed successfully!"
